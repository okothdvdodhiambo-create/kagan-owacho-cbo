{% load koc_tags %}{% if page_obj.paginator.num_pages > 1 %}
  <nav class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3" aria-label="Pagination">
    <span class="small-muted">
      Showing {{ page_obj.start_index }}&ndash;{{ page_obj.end_index }} of {{ page_obj.paginator.count }}
    </span>
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
        <a class="page-link" href="{% if page_obj.has_previous %}{% keep_query page=page_obj.previous_page_number %}{% else %}#{% endif %}">&laquo; Previous</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
      </li>
      <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
        <a class="page-link" href="{% if page_obj.has_next %}{% keep_query page=page_obj.next_page_number %}{% else %}#{% endif %}">Next &raquo;</a>
      </li>
    </ul>
  </nav>
{% endif %}
