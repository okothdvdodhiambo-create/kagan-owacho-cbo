<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <style>
    body { margin:0; padding:48px 20px; background:#f4f6f5; color:#12261f;
           font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; }
    .card { max-width:620px; margin:0 auto; background:#fff; border:1px solid #dfe6e2;
            border-radius:16px; padding:36px 32px; text-align:center;
            box-shadow:0 12px 30px rgba(18,38,31,.08); }
    .badge { display:inline-block; width:56px; height:56px; line-height:56px; border-radius:50%;
             background:#0c4a3c; color:#f0b429; font-weight:700; font-size:20px; margin-bottom:16px; }
    h1 { font-size:22px; margin:0 0 10px; }
    p { color:#4a5b54; line-height:1.6; margin:0 0 8px; }
    a { display:inline-block; margin-top:22px; padding:11px 22px; border-radius:999px;
        background:#0c4a3c; color:#fff; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">KO</div>
    <h1>Sorry, the site hit a problem</h1>
    <p>Nothing you did broke it - a server error happened while the page was building. Please try again in a minute.</p>
    <p>If it keeps happening, tell the committee on WhatsApp or by email and they will check the server log.</p>
    <a href="/">Back to the home page</a>
  </div>
</body>
</html>
