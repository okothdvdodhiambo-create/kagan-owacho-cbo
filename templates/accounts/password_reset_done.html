{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="koco-card text-center">
      <i class="fa fa-paper-plane fa-3x text-gold mb-3"></i>
      <h1 class="page-title h4">Check your inbox</h1>
      <p class="mb-0">
        If that email belongs to an account, a reset link is on its way. Follow it within a few hours.
        Nothing arrives? Check the spam folder or ask the treasurer to confirm your email address.
      </p>
      <a class="koco-btn koco-btn-outline mt-4" href="{% url 'accounts:login' %}">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
