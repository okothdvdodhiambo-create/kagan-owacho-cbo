{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="koco-card koco-form">
      <h1 class="page-title h4 mb-3">Change password</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/_form_fields.html" %}
        <button type="submit" class="koco-btn koco-btn-primary"><i class="fa fa-lock"></i> Update password</button>
        <a class="koco-btn koco-btn-outline" href="{% url 'accounts:profile' %}">Cancel</a>
      </form>
      <p class="form-help mt-3">Choose at least 8 characters with a capital letter, a small letter and a number.</p>
    </div>
  </div>
</div>
{% endblock %}
