{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="koco-card koco-form">
      <h1 class="page-title h4 mb-1">Forgot password</h1>
      <p class="koco-lead">Enter the email you registered with and we will send a reset link.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/_form_fields.html" %}
        <button type="submit" class="koco-btn koco-btn-primary w-100 justify-content-center">
          <i class="fa fa-envelope-circle-check"></i> Send reset link
        </button>
      </form>
      <p class="small-muted mt-3 mb-0">
        Remembered it? <a href="{% url 'accounts:login' %}">Log in</a> &middot;
        New here? <a href="{% url 'accounts:signup' %}">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
